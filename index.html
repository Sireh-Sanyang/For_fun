<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #ffe4ec;
    font-family: 'Caveat', cursive;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
  }

  .hint { font-size: 1.6rem; color: #c2185b; margin-bottom: 20px; }

  #envelope {
    font-size: 8rem;
    cursor: pointer;
    animation: beat 1.2s infinite;
    user-select: none;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  #letter {
    display: none;
    width: 88%;
    max-width: 420px;
    max-height: 92vh;
    overflow-y: auto;
    background: #fffaf3;
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    font-size: 1.7rem;
    line-height: 1.4;
    color: #5a2a3a;
    text-align: left;
    animation: slideUp 0.8s ease;
  }
  #letter img { width: 100%; border-radius: 12px; margin-bottom: 16px; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #questionBox { display: none; margin-top: 22px; text-align: center; }
  #question { font-size: 2rem; color: #c2185b; margin-bottom: 14px; }
  .btn {
    font-family: 'Caveat', cursive;
    font-size: 1.6rem;
    padding: 8px 24px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    margin: 0 6px;
  }
  #yesBtn { background: #e91e63; color: #fff; }
  #noBtn  { background: #ddd; color: #555; z-index: 10; }
  #answer { font-size: 2rem; color: #c2185b; margin-top: 10px; }

  #resetBtn {
    display: none;
    margin: 18px auto 0;
    font-size: 1.3rem;
    background: transparent;
    color: #999;
    border: none;
    cursor: pointer;
    font-family: 'Caveat', cursive;
  }

  .heart {
    position: fixed;
    bottom: -40px;
    font-size: 1.8rem;
    animation: floatUp 4s linear forwards;
    pointer-events: none;
  }
  @keyframes floatUp {
    to { transform: translateY(-110vh); opacity: 0; }
  }
</style>
</head>
<body>

  <p class="hint" id="hint">Tap the envelope 💌</p>
  <div id="envelope">💌</div>

  <div id="letter">
    <img src="photo.jpg" alt="Us" onerror="this.style.display='none'">
    <p id="text"></p>

    <div id="questionBox">
      <p id="question"></p>
      <button class="btn" id="yesBtn">Accept 💖</button>
      <button class="btn" id="noBtn">Decline</button>
      <p id="answer"></p>
    </div>

    <div style="text-align:center">
      <button id="resetBtn">Read again 🔄</button>
    </div>
  </div>

  <audio id="song" src="song.mp3" loop></audio>

<script>
  // ✏️ SETTINGS: change these
  const message =
`My Dear Abu k,

I made this little page just for you,
because I wanted to tell you something
that comes straight from my heart.

I am broke and I need some money, help a sister out. 😅
I promise to pay you back with interest, but for now, I just want to say:
You're all I have.

Thank you for being you.
I love you. ❤️`;

  const questionText = "So... do you accept or decline? 😅";
  const yesReply     = "Thank you!! You're the best 🎉❤️";
  const NTFY_TOPIC   = "change-me-to-something-random-8x42kq91";
  const NOTIFY_TEXT  = "He accepted! 💸💖";

  // What the Decline button says each time he tries to touch it
  const declineTexts = [
    "Think again 🤔",
    "Are you sure? 🥺",
    "Last chance 💸",
    "Don't do this to me 😭",
    "I'll cry 😢",
    "Just press Accept 😤"
  ];

  const $ = id => document.getElementById(id);
  const envelope = $('envelope'), letter = $('letter'), hint = $('hint');
  const textEl = $('text'), resetBtn = $('resetBtn'), song = $('song');
  const questionBox = $('questionBox'), yesBtn = $('yesBtn'), noBtn = $('noBtn');
  const answerEl = $('answer');

  let heartTimer = null, typeTimer = null, dodgeCount = 0;

  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['❤️','💖','💕','💗'][Math.floor(Math.random() * 4)];
    h.style.left = Math.random() * 95 + 'vw';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 4000);
  }

  function typeWriter(i = 0) {
    textEl.innerHTML = message.slice(0, i).replace(/\n/g, '<br>');
    if (i < message.length) {
      typeTimer = setTimeout(() => typeWriter(i + 1), 45);
    } else {
      $('question').textContent = questionText;
      questionBox.style.display = 'block';
      resetBtn.style.display = 'inline-block';
      letter.scrollTop = letter.scrollHeight;
    }
  }

  function openLetter() {
    envelope.style.display = 'none';
    hint.style.display = 'none';
    letter.style.display = 'block';
    if (navigator.vibrate) navigator.vibrate(200);
    song.play().catch(() => {});
    typeWriter();
    heartTimer = setInterval(spawnHeart, 400);
  }

  // Decline button runs away and changes its text
  function dodge(e) {
    if (e) e.preventDefault();
    noBtn.textContent = declineTexts[Math.min(dodgeCount, declineTexts.length - 1)];
    dodgeCount++;
    noBtn.style.position = 'fixed';
    noBtn.style.left = Math.random() * 60 + 10 + 'vw';
    noBtn.style.top  = Math.random() * 70 + 10 + 'vh';
  }
  noBtn.addEventListener('touchstart', dodge);
  noBtn.addEventListener('mouseover', dodge);
  noBtn.addEventListener('click', dodge);

  function sayYes() {
    answerEl.textContent = yesReply;
    yesBtn.style.display = 'none';
    noBtn.style.display = 'none';
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    for (let i = 0; i < 25; i++) setTimeout(spawnHeart, i * 80);
    fetch('https://ntfy.sh/' + NTFY_TOPIC, { method: 'POST', body: NOTIFY_TEXT })
      .catch(() => {});
  }
  yesBtn.addEventListener('click', sayYes);

  function resetAll() {
    clearTimeout(typeTimer);
    clearInterval(heartTimer);
    song.pause();
    song.currentTime = 0;
    textEl.innerHTML = '';
    answerEl.textContent = '';
    questionBox.style.display = 'none';
    yesBtn.style.display = 'inline-block';
    noBtn.style.display = 'inline-block';
    noBtn.textContent = 'Decline';
    noBtn.style.position = '';
    noBtn.style.left = '';
    noBtn.style.top = '';
    dodgeCount = 0;
    resetBtn.style.display = 'none';
    letter.style.display = 'none';
    envelope.style.display = 'block';
    hint.style.display = 'block';
  }

  envelope.addEventListener('click', openLetter);
  resetBtn.addEventListener('click', resetAll);
</script>
</body>
</html>
